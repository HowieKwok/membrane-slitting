<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FindIntersectionAngle UI Preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei UI", "Segoe UI", Arial, sans-serif;
      color: #e9fbff;
      background:
        linear-gradient(90deg, rgba(0, 229, 255, .08) 1px, transparent 1px),
        linear-gradient(0deg, rgba(0, 229, 255, .055) 1px, transparent 1px),
        radial-gradient(circle at 28% 18%, rgba(0, 229, 255, .18), transparent 30%),
        radial-gradient(circle at 78% 72%, rgba(255, 46, 154, .10), transparent 34%),
        #070d14;
      background-size: 42px 42px, 42px 42px, auto, auto, auto;
      padding: 22px;
    }
    .shell {
      width: min(1180px, 100%);
      margin: 0 auto;
      border: 1px solid rgba(0, 229, 255, .45);
      background: rgba(10, 17, 28, .86);
      box-shadow: 0 0 36px rgba(0, 229, 255, .18), inset 0 0 45px rgba(0, 229, 255, .06);
    }
    .top {
      display: flex;
      align-items: center;
      height: 58px;
      padding: 0 16px;
      border-bottom: 1px solid rgba(0, 229, 255, .28);
      background: linear-gradient(90deg, rgba(0, 229, 255, .13), rgba(15, 22, 32, .9) 46%, rgba(255, 46, 154, .08));
    }
    .brand {
      width: 190px;
      font-size: 19px;
      font-weight: 800;
      color: #00e5ff;
      text-shadow: 0 0 14px rgba(0, 229, 255, .75);
    }
    .angle {
      width: 250px;
      font-weight: 700;
      color: #ffffff;
    }
    .status {
      flex: 1;
      color: #9fb8c7;
      font-size: 13px;
    }
    .tools { display: flex; gap: 8px; }
    .tool {
      width: 40px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid #00d8ff;
      color: white;
      background: #151f2b;
      box-shadow: inset 0 0 16px rgba(0, 229, 255, .10);
      font-size: 18px;
      font-weight: 800;
    }
    .layout {
      display: grid;
      grid-template-columns: 1fr 370px;
      gap: 12px;
      padding: 12px;
    }
    .viewport {
      min-height: 545px;
      border: 1px solid rgba(0, 229, 255, .32);
      background:
        linear-gradient(135deg, rgba(0, 229, 255, .12), transparent 28%),
        repeating-linear-gradient(0deg, transparent 0 18px, rgba(0, 229, 255, .04) 19px),
        #020407;
      position: relative;
      overflow: hidden;
    }
    .roi, .roi.two {
      position: absolute;
      left: 20%;
      top: 43%;
      width: 430px;
      height: 28px;
      border: 1px solid #00e5ff;
      transform: rotate(12deg);
      box-shadow: 0 0 18px rgba(0, 229, 255, .65);
    }
    .roi.two {
      left: 47%;
      top: 31%;
      transform: rotate(101deg);
      border-color: #42ff9e;
      box-shadow: 0 0 18px rgba(66, 255, 158, .55);
    }
    .cross {
      position: absolute;
      left: 52%;
      top: 43%;
      width: 52px;
      height: 52px;
      transform: translate(-50%, -50%);
      border: 1px solid #ff2e9a;
      box-shadow: 0 0 22px rgba(255, 46, 154, .7);
    }
    .cross:before, .cross:after {
      content: "";
      position: absolute;
      background: #ff2e9a;
      box-shadow: 0 0 16px #ff2e9a;
    }
    .cross:before { left: 50%; top: -14px; width: 1px; height: 80px; }
    .cross:after { top: 50%; left: -14px; height: 1px; width: 80px; }
    .profiles {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
    }
    .profile {
      height: 120px;
      border: 1px solid rgba(0, 229, 255, .28);
      background: linear-gradient(180deg, rgba(0, 229, 255, .08), rgba(8, 14, 22, .95));
      padding: 10px;
      color: #7ee6ff;
      font-size: 13px;
    }
    .panel {
      border: 1px solid rgba(0, 229, 255, .35);
      background: #111923;
      min-height: 677px;
    }
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: 1px solid rgba(0, 229, 255, .32);
    }
    .tab {
      padding: 11px 8px;
      text-align: center;
      font-weight: 800;
      color: #cceff8;
      border-right: 1px solid rgba(0, 229, 255, .22);
      background: #151f2b;
    }
    .tab.active {
      color: #061019;
      background: linear-gradient(90deg, #00d8ff, #7ee6ff);
      text-shadow: none;
    }
    .form {
      padding: 16px;
    }
    .section {
      margin: 0 0 16px;
      padding: 12px;
      border: 1px solid rgba(0, 229, 255, .25);
      background: rgba(4, 9, 15, .45);
    }
    .section h3 {
      margin: 0 0 10px;
      color: #00e5ff;
      font-size: 15px;
      letter-spacing: .5px;
    }
    .grid {
      display: grid;
      grid-template-columns: 104px 1fr;
      gap: 8px 10px;
      align-items: center;
    }
    label { color: #b8ced8; font-size: 13px; }
    input, select {
      height: 30px;
      border: 1px solid #315e76;
      background: #070d14;
      color: white;
      padding: 0 9px;
      outline: none;
    }
    .result {
      display: grid;
      gap: 12px;
    }
    .readout {
      border: 1px solid rgba(0, 229, 255, .28);
      background: rgba(0, 229, 255, .06);
      padding: 13px;
    }
    .readout strong {
      display: block;
      font-size: 28px;
      color: #00e5ff;
      text-shadow: 0 0 14px rgba(0, 229, 255, .65);
      margin-bottom: 8px;
    }
    .bar {
      display: flex;
      align-items: center;
      height: 38px;
      padding: 0 12px;
      border-top: 1px solid rgba(0, 229, 255, .25);
      color: #aec7d3;
      gap: 28px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="top">
      <div class="brand">两线交点角度工具</div>
      <div class="angle">当前夹角：37.428 度</div>
      <div class="status">状态：已输出交点 / 等待下一次执行</div>
      <div class="tools">
        <div class="tool">↥</div>
        <div class="tool">⟳</div>
        <div class="tool">⌖</div>
        <div class="tool">▶</div>
        <div class="tool">▣</div>
      </div>
    </div>
    <div class="layout">
      <div>
        <div class="viewport">
          <div class="roi"></div>
          <div class="roi two"></div>
          <div class="cross"></div>
        </div>
        <div class="profiles">
          <div class="profile">H 灰度曲线</div>
          <div class="profile">V 灰度曲线</div>
        </div>
      </div>
      <div class="panel">
        <div class="tabs">
          <div class="tab active">线1参数</div>
          <div class="tab">线2参数</div>
          <div class="tab">结果输出</div>
        </div>
        <div class="form">
          <div class="section">
            <h3>ROI 参数</h3>
            <div class="grid">
              <label>中心 R</label><input value="200">
              <label>中心 C</label><input value="300">
              <label>角度</label><input value="0">
              <label>高度</label><input value="200">
              <label>宽度</label><input value="100">
              <label>采样点数</label><input value="20">
            </div>
          </div>
          <div class="section">
            <h3>抓边参数</h3>
            <div class="grid">
              <label>Sigma</label><input value="1.0">
              <label>阈值</label><input value="30">
              <label>边数量</label><input value="1">
              <label>距离阈值</label><input value="2">
              <label>最小得分</label><input value="0.7">
              <label>明暗方向</label><select><option>all</option></select>
            </div>
          </div>
          <div class="section result">
            <h3>结果输出</h3>
            <div class="readout">
              <strong>37.428 度</strong>
              交点：R=256.42  C=381.77
            </div>
            <div>线1拟合：成功</div>
            <div>线2拟合：成功</div>
            <div>是否平行：否</div>
          </div>
        </div>
      </div>
    </div>
    <div class="bar">
      <span>图像：2448 x 2048</span>
      <span>行：--  列：--  灰度：--</span>
      <span>输出：IntersectionRow / IntersectionColumn / PointRow / PointColumn</span>
    </div>
  </div>
</body>
</html>
